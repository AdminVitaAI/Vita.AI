version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./backend:/app
      - ./backend/src/database:/app/src/database
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=vita_ai
      - POSTGRES_USER=vita_ai_user
      - POSTGRES_PASSWORD=vita_ai_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:

